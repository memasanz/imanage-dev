# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# iManage AI Workspace - Foundry hosted agent (Microsoft Agent Framework).
# The agent reads iManage documents directly from the iManage MCP endpoint
# (IMANAGE_MCP_URL: the governed APIM /imanage/mcp route in production, the mock in dev),
# carrying the SIGNED-IN USER'S own iManage bearer on every call ("the way iManage works").
# The web app supplies that token per request as the `imanageToken` structured input,
# bound into the MCP Authorization header via {{imanageToken}} — no Foundry OBO consent gate.

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.17'
    azure.ai.connections: '>=1.0.0-beta.8'
    azure.ai.toolboxes: '>=1.0.0-beta.8'
name: imanage-grounded-chat
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.6-sol
        model:
          format: OpenAI
          name: gpt-5.6-sol
          version: '2026-07-09'
        sku:
          name: GlobalStandard
          capacity: 150
  imanage-grounded-chat:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Responses Protocol
    project: src/agent-framework-agent-with-foundry-toolbox-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: imanage-grounded-chat
    description: iManage AI Workspace grounded chat agent.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      IMANAGE_MCP_URL: ${IMANAGE_MCP_URL}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
